[project]
name = "backuplc"
version = "0.6.1"
description = "Backup de configurações de switches com dashboard de saúde"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false
# Só aceita versões publicadas há pelo menos ~2 semanas da data do lock.
exclude-newer = "2026-10-21T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/backuplc"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["netmiko", "netmiko.*", "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# apscheduler/netmiko tipos são Any; ignore hints redundantes sem stubs.
module = ["backuplc.collector.runner", "backuplc.scheduler.service"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: testes de unidade",
    "integration: testes com banco e aplicação",
    "security: testes de segurança (segredos, cabeçalhos, frontend)",
]
