{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card card">
    <div class="login-brand">
      <svg class="login-brand__logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="6" width="26" height="8" rx="2.5" class="brand__shape"/>
        <rect x="3" y="18" width="26" height="8" rx="2.5" class="brand__shape brand__shape--alt"/>
        <circle cx="8.5" cy="10" r="1.6" class="brand__led"/>
        <circle cx="8.5" cy="22" r="1.6" class="brand__led"/>
      </svg>
      <div>
        <p class="login-brand__name">backup<strong>-lc</strong></p>
        <p class="login-brand__tagline">Backup de configuração de switches</p>
      </div>
    </div>

    <div class="login-divider" aria-hidden="true"></div>

    {% if error %}
    <p class="flash flash--error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form__group">
        <label class="form__label" for="username">Login</label>
        <input class="form__input" type="text" id="username" name="username"
               autocomplete="username" required autofocus>
      </div>
      <div class="form__group">
        <label class="form__label" for="password">Acesso</label>
        <input class="form__input" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button class="button button--full" type="submit">Entrar</button>
    </form>
  </div>
</section>
{% endblock %}
