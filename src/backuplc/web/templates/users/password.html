{% extends "base.html" %}
{% block title %}Alterar senha — {{ user.username }}{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Usuários</p>
    <h1>Alterar senha: {{ user.username }}</h1>
  </div>
  <a class="button button--ghost" href="/users">Voltar</a>
</section>

{% for e in errors %}
<p class="flash flash--error" role="alert">{{ e }}</p>
{% endfor %}

<div class="card">
  <form method="post" action="/users/{{ user.id }}/password">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">

    <div class="form__group">
      <label class="form__label" for="password">Nova senha</label>
      <input class="form__input" type="password" id="password" name="password"
             autocomplete="new-password" required autofocus>
      <small class="muted">Mínimo 12 caracteres, com maiúscula, minúscula e número.</small>
    </div>

    <div class="form__group">
      <label class="form__label" for="confirm">Confirmar senha</label>
      <input class="form__input" type="password" id="confirm" name="confirm"
             autocomplete="new-password" required>
    </div>

    <div class="form__actions">
      <button class="button" type="submit">Salvar nova senha</button>
      <a class="button button--ghost" href="/users">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
